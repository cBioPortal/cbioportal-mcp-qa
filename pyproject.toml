[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbioportal-mcp-qa"
version = "0.2.0"
description = "Benchmark for cBioPortalChat, run against the deployed agent via LibreChat's Agents API"
requires-python = ">=3.13"
dependencies = [
    "anthropic[bedrock]>=1.8.0",
    "click>=8.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cbioportal-mcp-qa = "cbioportal_mcp_qa.cli:cli"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
