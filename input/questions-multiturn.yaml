# Multi-turn follow-ups, modeled on real cBioAgent conversations in Langfuse (paraphrased).
# `history` holds the earlier turns; `question` is the user's next message and is what gets graded.
# Run with: cbioportal-mcp-qa run --questions-file input/questions-multiturn.yaml
- id: 1001
  track: data
  category: Variants & hotspots
  study: msk_impact_50k_2026
  history:
  - role: user
    content: What is the % of KRAS G12D across different tumor types? Use the MSK-IMPACT dataset.
  - role: assistant
    content: |
      In MSK-IMPACT (msk_impact_50k_2026), KRAS G12D by cancer type (samples profiled for KRAS):
      - Pancreatic Cancer: 964 / 2,851 (33.8%)
      - Colorectal Cancer: 674 / 5,277 (12.8%)
      - Cancer of Unknown Primary: 100 / 1,581 (6.3%)
      - Endometrial Cancer: 135 / 2,445 (5.5%)
      - Non-Small Cell Lung Cancer: 285 / 7,867 (3.6%)
  question: How about G12C?
  expected_answer: Non-Small Cell Lung Cancer 922 / 7,867 (11.7%) is highest; then Colorectal 158 / 5,277 (3.0%), Cancer of Unknown Primary 48 / 1,581 (3.0%), Endometrial 30 / 2,445 (1.2%), Pancreatic 33 / 2,851 (1.2%).
  expected_links: []
  notes: |
    A correct answer must: report KRAS G12C by cancer type in the same study (msk_impact_50k_2026) with the same KRAS-profiled denominators, and show NSCLC as clearly the highest (~11.7%).
    Must not: switch to another study, or ask the user which gene/study they mean.
  checked: '2026-09-25'
  source: curated
  trace_id: e1a32f710c00ed1546ab9a4de294f855
