- id: 1013
  track: out_of_scope
  category: Out of scope
  study: All Studies
  technical: true
  history:
  - role: user
    content: I'm importing a study into my own cBioPortal instance and the validator says some genes are not known to cBioPortal. What does that mean?
  - role: assistant
    content: |
      The validator checks every Hugo_Symbol / Entrez_Gene_Id in your data files against the gene table loaded in your instance (built from HGNC/NCBI). "Gene not known" means the symbol or ID isn't in that table — usually an outdated symbol, an alias, or a typo.
  question: what if the genes, like AC002511.1 or LOC100506271, just aren't in HGNC or NCBI at all?
  expected_answer: ''
  expected_links: []
  notes: |
    A correct answer must: explain that genes absent from the instance's gene table can't be loaded (the importer skips those rows; the validator warns), and suggest mapping them to a current HGNC symbol / Entrez ID where one exists or accepting that they will be left out.
    Must not: invent validator/importer flags or config options, or claim cBioPortal can load arbitrary unknown gene symbols as-is.
  checked: null
  source: curated
  trace_id: 328a3617b285b51badea4aa79b753f08
