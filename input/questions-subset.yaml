# Subset questions: statistics over a SUBSET of samples or patients, where per-study precomputed tables and
# purpose-built per-study tools (top genes in study X, frequency of gene Y in study X by CANCER_TYPE) don't fit.
# The agent has to write correct SQL for the subset, and must not answer with the whole-study (or per-CANCER_TYPE)
# number, which answers a different question. Kept apart from questions.yaml so the main set stays comparable.
# Run with: cbioportal-mcp-qa run --questions-file input/questions-subset.yaml
#
# Reference answers were computed on 2026-10-01 with read-only SQL against ClickHouse database
# cbioportal_public_librechat_blue (data refreshes daily). `sql` names the file in input/subset-sql/ with the exact
# query; see input/subset-sql/README.md to re-run them.
#
# Frequency convention (same as the top_mutated_genes_in_study / gene_mutation_frequency_in_study views):
# denominator = subset samples profiled for the gene (mutation_panel_gene_coverage for that gene, plus
# mutation_wes_coverage); numerator = those with a mutation in genomic_event_derived (variant_type = 'mutation',
# mutation_status != 'UNCALLED', off_panel = 0), counted with COUNT(DISTINCT sample). Patient attributes (GENDER,
# SMOKING_*, HR, HER2, STAGE_HIGHEST_RECORDED, OS_STATUS, LIVER) are joined through the patient.
#
# Subtypes (in each question's notes): clinical-subset frequency, pooled studies, co-occurrence in a subset, top
# genes in a subset, subset comparison, patient vs sample level, clinical counts in a mutation-defined subset,
# multi-turn narrowing, and a fast-path trap (a subset finer than CANCER_TYPE).
#
# Every 'Must not' names the concrete numbers a wrong cohort or level would give; the queries for them follow the
# reference query in the same SQL file, each headed '-- Baseline for Q<id>'.

