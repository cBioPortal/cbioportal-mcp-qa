  expected_answer: 'Depends on the statistic, in the TCGA PanCancer Atlas studies (TMB_NONSYNONYMOUS): highest mean is uterine endometrial carcinoma (UCEC, 35.66, driven by hypermutators), then melanoma (SKCM, 25.91); highest median is melanoma (SKCM, 14.88), then LUSC 7.67, LUAD 6.68, BLCA 5.77.'
  expected_links: []
