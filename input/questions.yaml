  study: gbm_tcga_pub2013
  question: How does methylation of the MGMT gene promoter affect the prognosis and treatment response in patients with glioblastoma?
  expected_answer: 'MGMT promoter methylation is associated with improved overall survival across multiple treatment contexts in glioblastoma according to the Glioblastoma (TCGA, Cell 2013) study. Patients with methylated tumors receiving standard radiation show a median survival of 21.2 months (95% CI 7.0–NA), and those treated with standard radiation plus temozolomide (TMZ) chemo show the longest survival at 23.5 months (22.2–47.9). Methylated tumors treated with TMZ chemoradiation plus TMZ achieve a median survival of 17.8 months (15.7–21.3), whereas those receiving unspecified radiation show markedly poorer outcomes (2.2 months, 1.4–3.9). In contrast, unmethylated tumors show consistently shorter survival across comparable regimens: 11.6 months (10.3–NA) with standard radiation, 12.7 months (11.7–19.3) with standard radiation plus TMZ, 14.5 months (12.9–15.9) with TMZ chemoradiation plus TMZ, and 2.7 months (1.2–5.4) with unspecified radiation. Across all groups, survival curves for
    methylated tumors cluster at higher survival times, indicating that MGMT promoter methylation confers both a prognostic advantage and increased benefit from TMZ-containing therapy.'
  expected_links:
  - https://www.cbioportal.org/comparison/survival?comparisonId=68f0de477783fa02c7f2f64f
