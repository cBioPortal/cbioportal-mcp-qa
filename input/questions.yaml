# cBioPortalChat benchmark questions. `id` is stable: never renumber or reuse ids.
# track: data (a fact from the data) | navigation (a cBioPortal link/view) | analysis (comparison, survival, statistics) | out_of_scope (should decline).
# category: Study discovery | Cohort & clinical counts | Alteration frequency | Variants & hotspots | Co-occurrence & exclusivity | Expression & multi-omics | Survival & outcomes | Treatment | Patient & sample lookup | Out of scope.
# expected_answer / expected_links / notes (a "must ... / must not ..." rubric) are what the judge grades against.
