- id: 23
  track: analysis
  category: Cohort & clinical counts
  study: msk_chord_2024
  question: What is the correlation between tumor mutational burden and microsatellite instability status in colorectal cancer patients from the MSK-CHORD Study?
  expected_answer: Tumor mutational burden (TMB) demonstrates a significant positive association with microsatellite instability (MSI) in colorectal cancer patients from the MSK-CHORD cohort. Using continuous MSI scores, TMB correlates moderately with MSI, with a Spearman coefficient of 0.37 (p = 1.18 × 10⁻¹⁷⁵) and a Pearson coefficient of 0.58 (p = 0.00), indicating that higher MSI scores correspond to higher mutational burden. Consistent with these quantitative correlations, categorical MSI typing shows a clear separation wherein MSI-instable tumors exhibit high TMB, MSI-stable tumors show uniformly low TMB, and indeterminate cases fall between these groups.
  expected_links:
  - https://www.cbioportal.org/study/plots?id=msk_chord_2024&plots_horz_selection=%7B%22dataType%22%3A%22clinical_attribute%22%2C%22selectedDataSourceOption%22%3A%22TMB_NONSYNONYMOUS%22%7D&plots_vert_selection=%7B%22dataType%22%3A%22clinical_attribute%22%2C%22selectedDataSourceOption%22%3A%22MSI_SCORE%22%7D#filterJson={
  notes: ''
  checked: '2026-09-23'
  source: curated
