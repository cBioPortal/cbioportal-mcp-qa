- id: 36
  track: analysis
  category: Expression & multi-omics
  study: ov_tcga_pan_can_atlas_2018
  question: Is BRCA1 promoter methylation associated with decreased BRCA1 mRNA expression in ovarian cancer?
  expected_answer: “In the Ovarian Serous Cystadenocarcinoma (TCGA, PanCancer Atlas) cohort, BRCA1 promoter methylation is clearly associated with reduced BRCA1 mRNA expression. Increasing methylation at the promoter-associated probe (cg04658354) shows a strong inverse correlation with BRCA1 transcript levels (Pearson r = –0.69, Spearman r = –0.43; both p < 1×10⁻¹⁴). These findings indicate that promoter hypermethylation actively corresponds to transcriptional downregulation of BRCA1 in ovarian tumors.”
