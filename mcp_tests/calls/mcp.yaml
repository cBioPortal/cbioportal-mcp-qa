# Fixed tool calls for the cBioPortal database MCP server (cBioPortal/cbioportal-mcp).
# Each runs against the server under test and the baseline; results must match.
# Keep SQL deterministic (ORDER BY with tie-breakers) so row order doesn't cause false diffs.

- id: list_tables
  tool: clickhouse_list_tables
- id: columns_cancer_study
  tool: clickhouse_list_table_columns
  args: {table: cancer_study}
- id: columns_genomic_event_derived
  tool: clickhouse_list_table_columns
  args: {table: genomic_event_derived}
- id: list_studies_glioblastoma
  tool: list_studies
  args: {search: glioblastoma, limit: 50}
- id: list_studies_default
  tool: list_studies
- id: list_study_guides
  tool: list_study_guides
- id: study_guide_msk_chord
  tool: get_study_guide
  args: {study_id: msk_chord_2024}
- id: study_guide_generated
  tool: get_study_guide
  args: {study_id: os_target_gdc}
- id: oncotree_glioma
  tool: search_oncotree
  args: {search_term: glioma}
- id: oncotree_deprecated_code
  tool: search_oncotree
  args: {search_term: ALL}
- id: list_guides
  tool: list_guides

- id: sql_study_count
  tool: clickhouse_run_select_query
  args: {query: "SELECT count() AS n FROM cancer_study"}
- id: sql_glioblastoma_studies
  tool: clickhouse_run_select_query
  args:
    query: >-
      SELECT cancer_study_identifier, name FROM cancer_study
      WHERE positionCaseInsensitive(name, 'glioblastoma') > 0 ORDER BY cancer_study_identifier
- id: sql_top_mutated_os_target
  tool: clickhouse_run_select_query
  args:
    query: >-
      SELECT hugo_gene_symbol, count(DISTINCT sample_unique_id) AS n FROM genomic_event_derived
      WHERE cancer_study_identifier = 'os_target_gdc' AND variant_type = 'mutation'
      GROUP BY hugo_gene_symbol ORDER BY n DESC, hugo_gene_symbol LIMIT 5
- id: sql_msk_chord_counts
  tool: clickhouse_run_select_query
  args:
    query: >-
      SELECT count(DISTINCT patient_unique_id) AS patients, count(DISTINCT sample_unique_id) AS samples
      FROM sample_derived WHERE cancer_study_identifier = 'msk_chord_2024'
- id: sql_invalid_rejected
  tool: clickhouse_run_select_query
  args: {query: "DROP TABLE cancer_study"}
  expect_error: true

# GOLDEN: stable identity + non-empty, numerically consistent results.
- id: golden_alteration_frequency
  tool: get_alteration_frequency
  args: {gene: tp53, study_id: brca_tcga_pan_can_atlas_2018, alteration_type: mutation}
  golden:
    contains: {gene: TP53, study_id: brca_tcga_pan_can_atlas_2018}
    min_rows: 1
    max_rows: 1
    kind: frequency
- id: golden_top_altered_genes
  tool: get_top_altered_genes
  args: {study_id: brca_tcga_pan_can_atlas_2018, alteration_type: mutation, top_n: 5}
  golden: {min_rows: 5, max_rows: 5, kind: frequency}
- id: golden_frequency_by_cancer_type
  tool: get_gene_frequency_by_cancer_type
  args: {gene: TP53, alteration_type: mutation, preference: pan_cancer_tcga, top_n: 5}
  golden: {min_rows: 5, max_rows: 5, kind: frequency}
- id: golden_profiled_counts
  tool: get_profiled_counts
  args: {study_id: brca_tcga_pan_can_atlas_2018}
  golden:
    contains: {profile_type: ALL_SAMPLES}
    min_rows: 2
    kind: profiled_counts
- id: golden_known_study
  tool: list_studies
  args: {search: brca_tcga_pan_can_atlas_2018, limit: 1}
  golden: {contains: {cancer_study_identifier: brca_tcga_pan_can_atlas_2018}, min_rows: 1, max_rows: 1}
- id: golden_oncotree
  tool: search_oncotree
  args: {search_term: BRCA}
  golden: {contains: {code: BRCA}, min_rows: 1, max_rows: 25}
- id: golden_gene_symbol
  tool: clickhouse_run_select_query
  args:
    query: "SELECT hugo_gene_symbol FROM gene WHERE hugo_gene_symbol = 'TP53' LIMIT 1"
  golden: {contains: {hugo_gene_symbol: TP53}, min_rows: 1, max_rows: 1}
- id: golden_study_sql
  tool: clickhouse_run_select_query
  args:
    query: "SELECT cancer_study_identifier FROM cancer_study WHERE cancer_study_identifier = 'brca_tcga_pan_can_atlas_2018' LIMIT 1"
  golden: {contains: {cancer_study_identifier: brca_tcga_pan_can_atlas_2018}, min_rows: 1, max_rows: 1}
- id: golden_sql_scalar
  tool: clickhouse_run_select_query
  args: {query: "SELECT 'TP53' AS symbol, 2 + 2 AS value"}
  golden: {contains: {symbol: TP53, value: 4}, min_rows: 1, max_rows: 1}
- id: golden_empty_select
  tool: clickhouse_run_select_query
  args: {query: "SELECT hugo_gene_symbol FROM gene WHERE 0"}
  golden: {min_rows: 0, max_rows: 0}
