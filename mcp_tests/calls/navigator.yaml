# Fixed tool calls for the cBioPortal navigator MCP server (cBioPortal/cbioportal-navigator).
# Each runs against the server under test and the baseline; the returned URLs and data must match.

- id: resolve_keywords
  tool: resolve_and_route
  args: {studyKeywords: [glioblastoma, tcga]}
- id: resolve_ids
  tool: resolve_and_route
  args: {studyIds: [msk_chord_2024]}
- id: study_view
  tool: navigate_to_study_view
  args: {studyIds: [msk_chord_2024]}
- id: study_view_clinical_filter
  tool: navigate_to_study_view
  args: {studyIds: [msk_chord_2024], filterAttributeId: CANCER_TYPE, filterValues: Breast Cancer}
- id: study_view_multi_study
  tool: navigate_to_study_view
  args: {studyIds: [lgg_tcga_pan_can_atlas_2018, gbm_tcga_pan_can_atlas_2018]}
- id: results_oncoprint
  tool: navigate_to_results_view
  args: {studyIds: [luad_tcga_pan_can_atlas_2018], genes: [EGFR, KRAS], tab: oncoprint}
- id: results_mutations_tab
  tool: navigate_to_results_view
  args: {studyIds: [msk_chord_2024], genes: [EGFR], tab: mutations}
- id: results_tab_as_json_string
  tool: navigate_to_results_view
  args: {studyIds: [msk_chord_2024], genes: [EGFR], tab: '["oncoprint"]'}
  expect_error: true
- id: patient_view
  tool: navigate_to_patient_view
  args: {studyIds: [msk_chord_2024], patientId: P-0000083}
- id: filter_options_cancer_type
  tool: get_studyviewfilter_options
  args: {studyId: msk_chord_2024, attributeIds: [CANCER_TYPE]}
- id: group_comparison
  tool: navigate_to_group_comparison
  args:
    studyIds: [lgg_tcga_pan_can_atlas_2018]
    groups:
      - {name: IDH1 mutant, studyViewFilter: {geneFilters: [{molecularProfileIds: [lgg_tcga_pan_can_atlas_2018_mutations], geneQueries: [[{hugoGeneSymbol: IDH1}]]}]}}
      - {name: IDH1 wild type, studyViewFilter: {}}
